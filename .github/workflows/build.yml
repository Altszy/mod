name: Build DonutTrader

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./DonutTrader
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        
    - name: Setup Gradle 8.8
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.8'  # Thêm dòng này
        
    - name: Build
      run: gradle build
      
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      with:
        name: DonutTrader-Mod
        path: DonutTrader/build/libs/*.jar
